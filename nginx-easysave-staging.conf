server {
    listen 80;
    server_name staging.easysave.vochusglobalservices.co.uk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name staging.easysave.vochusglobalservices.co.uk;

    ssl_certificate /etc/letsencrypt/live/staging.easysave.vochusglobalservices.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.easysave.vochusglobalservices.co.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    proxy_connect_timeout 600;
    proxy_send_timeout 600;
    proxy_read_timeout 600;
    send_timeout 600;

    client_max_body_size 50M;
    proxy_buffering off;

    location / {
        proxy_pass http://localhost:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;
    gzip_disable "MSIE [1-6]\.";
}
